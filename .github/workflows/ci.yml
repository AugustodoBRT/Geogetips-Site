# Portão de entrada da main: nenhum pull request é mesclado com isto vermelho.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR atualizado cancela a verificação anterior — vale a última.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Duas escolhas valem para os dois jobs abaixo:
#
# Node 24 é o LTS ativo. O 20 encerrou em 30/04/2026 — o CI vinha construindo o
# site em Node fora de suporte — e o 22 já está em manutenção, então pararia
# aqui de novo em pouco tempo.
#
# O runner é preso numa versão em vez de `ubuntu-latest` porque a suíte de tela
# tem teste de visual e de contraste, e sistema novo muda desenho de fonte.
# Assim a subida para o Ubuntu 26, que o rótulo `latest` faz sozinho em
# 19/10/2026, vira um pull request em que se vê o que quebra — e não uma
# segunda-feira em que a suíte fica vermelha sem ninguém ter tocado no código.
jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint e formatação
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      # A paleta vive em dois lugares: o :root do globals.css e src/lib/cores.ts,
      # que repete os hexadecimais para o Satori (ele não lê CSS variable).
      # Este script cobra que os dois digam a mesma coisa.
      - name: Paleta
        run: npm run checar:cores

      # As regras de número: ROI com pendentes e anuladas dentro, taxa de
      # acerto com elas fora, VOID, fuso de São Paulo, ordem do feed. A
      # cobertura tem limite mínimo configurado no vitest.config.mts e falha
      # sozinha se cair.
      - name: Testes e cobertura
        run: npm run teste:cobertura

      - name: Build de produção
        run: npm run build

      # Arquivo sem importador, exportação sem consumidor, dependência sem uso.
      - name: Código morto
        run: npm run morto

  telas:
    name: Testes de tela
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o navegador
        run: npm run e2e:navegador

      # O próprio Playwright faz o build e sobe o servidor na 3100, em modo
      # demonstração — ver playwright.config.mts. Roda contra o build de
      # produção de propósito: o Suspense e a divisão de pedaços do JavaScript
      # se comportam diferente em desenvolvimento.
      - name: Testes de tela
        run: npm run e2e

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
